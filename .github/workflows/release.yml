name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-released-generations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            app: '2.0.0'
            cqrs: '2.0.1'
            di: '3.0.0'
          - php: '8.5'
            app: '2.0.0'
            cqrs: '2.0.1'
            di: '3.0.0'
          - php: '8.4'
            app: '3.0.2'
            cqrs: '3.0.3'
            di: '4.0.2'
          - php: '8.5'
            app: '3.0.2'
            cqrs: '3.0.3'
            di: '4.0.2'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Select released compatibility generation
        shell: bash
        run: |
          composer require --no-update \
            "componenta/app:${{ matrix.app }}" \
            "componenta/cqrs:${{ matrix.cqrs }}" \
            "componenta/di:${{ matrix.di }}"
      - name: Install dependency matrix
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse

  verify-current-cqrs-v4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout current CQRS v4 source
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs
          ref: main
          path: .ci/cqrs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Select current CQRS v4 generation
        shell: bash
        run: |
          composer config --json repositories.componenta-cqrs '{"type":"path","url":".ci/cqrs","options":{"versions":{"componenta/cqrs":"4.0.0"}}}'
          composer require --no-update \
            componenta/app:3.0.2 \
            componenta/cqrs:4.0.0 \
            componenta/di:4.0.2
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify-released-generations, verify-current-cqrs-v4]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes

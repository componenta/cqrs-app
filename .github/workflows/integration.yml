name: CQRS integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          path: cqrs-app
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Check out companion packages
        run: |
          for package in $(php -r '$manifest = json_decode(file_get_contents("cqrs-app/integration/composer.json"), true, flags: JSON_THROW_ON_ERROR); foreach (array_keys($manifest["require"]) as $package) { if (str_starts_with($package, "componenta/") && $package !== "componenta/cqrs-app") { echo substr($package, 10), PHP_EOL; } }'); do
            git clone --depth 1 --branch main "https://github.com/componenta/$package.git" "$package"
          done
      - name: Install integration dependencies
        run: composer --working-dir=cqrs-app/integration install --no-interaction --prefer-dist --no-scripts
      - name: Test package integration
        run: composer --working-dir=cqrs-app/integration test
